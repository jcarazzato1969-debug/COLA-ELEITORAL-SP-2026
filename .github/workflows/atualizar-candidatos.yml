name: Atualizar candidatos do TSE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/baixar-tse.mjs, .github/workflows/atualizar-candidatos.yml]
  schedule:
    - cron: '17 */3 * * *'   # a cada 3 horas

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-candidatos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Baixar candidatos do DivulgaCandContas
        run: node scripts/baixar-tse.mjs
      - name: Salvar no repositório e republicar o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidatos.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos candidatos."
            exit 0
          fi
          git commit -m "Atualiza candidatos do TSE"
          git push
          # push feito com o token do Actions não dispara o build do Pages sozinho
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Não foi possível pedir o build do Pages."
